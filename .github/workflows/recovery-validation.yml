name: Full engine validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - audit/full-engine-2026-09
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for audit validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate audit workflows and parser regressions
        run: |
          python -m pip install --disable-pip-version-check pyyaml requests beautifulsoup4
          python scripts/test-audit-workflows.py
          python scripts/test-mdic-parser.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run complete regression and audit battery
        run: npm run test:all
      - name: Build production bundle
        run: npm run build
