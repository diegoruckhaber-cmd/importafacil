name: Legacy fiscal snapshot ingest (review only)

on:
  workflow_dispatch:

# Historical July snapshot maintenance only. This workflow generates a candidate
# artifact for human review and intentionally cannot publish to the repository.
# The production federal catalog is governed by the authoritative snapshot and
# publication runbook; fiscal data must reach main through a reviewed PR.
permissions:
  contents: read

jobs:
  ingest-legacy-july-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install openpyxl

      - name: Download historical MDIC tariff workbook
        run: |
          mkdir -p /tmp/fiscal
          curl -fL --retry 4 --retry-delay 3 \
            'https://www.gov.br/mdic/pt-br/assuntos/camex/estrategia-comercial/arquivos-listas/24-07-2026-anexos-i-a-x-resolucao-gecex-272-21.xlsx/@@download/file' \
            -o /tmp/fiscal/mdic.xlsx
          test -s /tmp/fiscal/mdic.xlsx

      - name: Download TIPI workbook
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            'https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/documentos-e-arquivos/tipi.xlsx/@@download/file' \
            -o /tmp/fiscal/tipi.xlsx
          test -s /tmp/fiscal/tipi.xlsx

      - name: Generate historical snapshot candidate
        run: |
          python scripts/ingest-official-fiscal-data.py \
            --mdic /tmp/fiscal/mdic.xlsx \
            --tipi /tmp/fiscal/tipi.xlsx \
            --output data/federal/official-snapshot-2026-07.json \
            --mdic-published 2026-07-24 \
            --tipi-updated 2026-02-13

      - name: Show candidate diff
        run: git diff --stat -- data/federal/official-snapshot-2026-07.json || true

      - name: Upload historical candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: federal-legacy-july-snapshot-candidate
          path: data/federal/official-snapshot-2026-07.json
          if-no-files-found: error
          retention-days: 14
