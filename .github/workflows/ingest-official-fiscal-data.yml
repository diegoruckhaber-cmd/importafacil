name: Legacy fiscal snapshot ingest (manual only)

on:
  workflow_dispatch:

# Historical July snapshot maintenance only. The production federal catalog is
# generated by Stage 2 Federal Source Audit from the authoritative 08/09/2026
# MDIC workbook and TIPI 13/02/2026. This legacy workflow must never run on
# parser pushes or move a launch-gate branch automatically.
permissions:
  contents: write

jobs:
  ingest-legacy-july-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: python -m pip install openpyxl

      - name: Download historical MDIC tariff workbook
        run: |
          mkdir -p /tmp/fiscal
          curl -fL --retry 4 --retry-delay 3 \
            'https://www.gov.br/mdic/pt-br/assuntos/camex/estrategia-comercial/arquivos-listas/24-07-2026-anexos-i-a-x-resolucao-gecex-272-21.xlsx/@@download/file' \
            -o /tmp/fiscal/mdic.xlsx
          test -s /tmp/fiscal/mdic.xlsx

      - name: Download TIPI workbook
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            'https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/documentos-e-arquivos/tipi.xlsx/@@download/file' \
            -o /tmp/fiscal/tipi.xlsx
          test -s /tmp/fiscal/tipi.xlsx

      - name: Generate historical snapshot
        run: |
          python scripts/ingest-official-fiscal-data.py \
            --mdic /tmp/fiscal/mdic.xlsx \
            --tipi /tmp/fiscal/tipi.xlsx \
            --output data/federal/official-snapshot-2026-07.json \
            --mdic-published 2026-07-24 \
            --tipi-updated 2026-02-13

      - name: Commit historical snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/federal/official-snapshot-2026-07.json
          git diff --cached --quiet || git commit -m 'chore: refresh historical July 2026 federal snapshot'
          git push
