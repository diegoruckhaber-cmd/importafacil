name: Stage 2 Federal Source Audit

on:
  push:
    branches:
      - stage2/federal-authoritative-snapshot
    paths:
      - '.github/workflows/stage2-federal-source-audit.yml'
      - 'scripts/inspect-federal-tariff-workbook.py'
      - 'scripts/ingest-official-fiscal-data.py'

permissions:
  contents: read

jobs:
  inspect-official-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Download MDIC tariffs 08/09/2026
        run: |
          curl --fail --location --retry 3 \
            'https://www.gov.br/mdic/pt-br/assuntos/camex/estrategia-comercial/arquivos-listas/08-09-2026-anexos-i-a-x-resolucao-gecex-272-21.xlsx' \
            --output /tmp/mdic.xlsx
          test -s /tmp/mdic.xlsx
      - name: Download RFB TIPI 13/02/2026
        run: |
          curl --fail --location --retry 3 \
            'https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/documentos-e-arquivos/tipi.xlsx/@@download/file' \
            --output /tmp/tipi.xlsx
          test -s /tmp/tipi.xlsx
      - name: Inspect MDIC workbook
        run: python scripts/inspect-federal-tariff-workbook.py /tmp/mdic.xlsx
      - name: Inspect TIPI workbook
        run: python scripts/inspect-federal-tariff-workbook.py /tmp/tipi.xlsx
      - name: Generate candidate snapshot and print summary
        run: |
          python scripts/ingest-official-fiscal-data.py --mdic /tmp/mdic.xlsx --tipi /tmp/tipi.xlsx --output /tmp/candidate.json
          python - <<'PY'
          import json
          p='/tmp/candidate.json'
          d=json.load(open(p, encoding='utf-8'))
          print('schemaVersion=', d['schemaVersion'])
          print('records=', len(d['records']))
          print('mdic=', d['sources']['mdic']['recordCount'])
          print('tipi=', d['sources']['rfbTipi']['recordCount'])
          print('bytes=', __import__('os').path.getsize(p))
          PY
