name: Audit MDIC defense commercial catalog

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# This workflow intentionally has no contents:write permission and never pushes
# fiscal data. It collects and validates a candidate catalog only. Publication
# requires a human-reviewed pull request under the legislative update runbook.
permissions:
  contents: read

jobs:
  audit-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Collect candidate from official MDIC sources
        run: python scripts/sync-mdic-defesa-comercial.py

      - name: Validate candidate catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/defesa-comercial-mdic.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data) >= 40, f'Expected at least 40 measures, got {len(data)}'
          assert all(item.get('ncm') and item.get('origins') and item.get('sourceUrl') for item in data)
          assert not any('encerrada' in (item.get('product') or '').lower() for item in data), 'Ended measure leaked into active catalog'
          missing = [
              (item['ncm'], item['product'], origin)
              for item in data
              for origin, options in item.get('exportersByOrigin', {}).items()
              if not options
          ]
          assert not missing, f'Active measure/origin without parsed right: {missing[:20]}'
          malformed = [
              (item['ncm'], option['exporter'])
              for item in data
              for options in item.get('exportersByOrigin', {}).values()
              for option in options
              if 'prazo da vigência' in (option.get('exporter') or '').lower() or 'prazo de vigência' in (option.get('exporter') or '').lower()
          ]
          assert not malformed, f'Validity text was parsed as exporter: {malformed[:10]}'
          sapp = next((item for item in data if item.get('ncm') == '28353920' and item.get('product') == 'Pirofosfato ácido de sódio (SAPP)'), None)
          assert sapp, 'SAPP measure missing from generated catalog'
          assert len(sapp.get('exportersByOrigin', {}).get('canadá', [])) == 2, 'SAPP Canada exporter table was not parsed'
          assert len(sapp.get('exportersByOrigin', {}).get('estados unidos da américa', [])) == 3, 'SAPP USA exporter table was not parsed'
          lisina = next((item for item in data if item.get('ncm') == '23099090'), None)
          assert lisina and len(lisina.get('exportersByOrigin', {}).get('china', [])) >= 17, 'Lisina exporter table was not fully parsed'
          assert any(option.get('rate') == 78 and option.get('unit') == 'AD_VALOREM' for option in lisina['exportersByOrigin']['china'])
          assert any(option.get('rate') == 132.6 for option in lisina['exportersByOrigin']['china'])
          square_meter_units = [
              option for item in data
              for options in item.get('exportersByOrigin', {}).values()
              for option in options
              if option.get('unit') == 'USD_PER_SQUARE_METER'
          ]
          assert square_meter_units, 'No USD_PER_SQUARE_METER measure parsed from official catalog'
          print(f'Validated {len(data)} defense-commercial candidate measures')
          PY

      - name: Run defense commercial resolver tests
        run: npx --yes tsx scripts/test-defesa-comercial-resolver.mjs

      - name: Summarize candidate diff for human review
        run: |
          git diff --stat -- data/defesa-comercial-mdic.json || true
          git diff --numstat -- data/defesa-comercial-mdic.json || true
          if git diff --quiet -- data/defesa-comercial-mdic.json; then
            echo 'No official-catalog change detected.'
          else
            echo 'Candidate changes detected. Review the generated catalog and official source URLs before opening a publication PR.'
          fi

      - name: Upload candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: mdic-defense-commercial-candidate
          path: data/defesa-comercial-mdic.json
          if-no-files-found: error
          retention-days: 14
