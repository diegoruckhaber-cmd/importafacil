name: Sync MDIC defense commercial catalog

on:
  push:
    branches: [recover/original-architecture]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Sync official MDIC catalog
        run: python scripts/sync-mdic-defesa-comercial.py

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/defesa-comercial-mdic.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data) >= 40, f'Expected at least 40 measures, got {len(data)}'
          assert all(item.get('ncm') and item.get('origins') and item.get('sourceUrl') for item in data)
          assert not any('encerrada' in (item.get('product') or '').lower() for item in data), 'Ended measure leaked into active catalog'
          sapp = next((item for item in data if item.get('ncm') == '28353920' and item.get('product') == 'Pirofosfato ácido de sódio (SAPP)'), None)
          assert sapp, 'SAPP measure missing from generated catalog'
          assert len(sapp.get('exportersByOrigin', {}).get('canadá', [])) == 2, 'SAPP Canada exporter table was not parsed'
          assert len(sapp.get('exportersByOrigin', {}).get('estados unidos da américa', [])) == 3, 'SAPP USA exporter table was not parsed'
          lisina = next((item for item in data if item.get('ncm') == '23099090'), None)
          assert lisina and len(lisina.get('exportersByOrigin', {}).get('china', [])) >= 5, 'Lisina exporter table was not parsed'
          print(f'Validated {len(data)} antidumping measures')
          PY

      - name: Run defense commercial resolver tests
        run: node --experimental-strip-types --experimental-specifier-resolution=node scripts/test-defesa-comercial-resolver.mjs

      - name: Commit catalog changes
        run: |
          git config user.name "importafacil-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/defesa-comercial-mdic.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore: sync official MDIC defense commercial catalog"
            git push
          fi
